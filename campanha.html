<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123d2c">
    <meta name="description" content="Escolha dezenas disponíveis na campanha Lea Rifas.">
    <link rel="icon" href="./icon.ico" sizes="any">
    <link rel="stylesheet" href="./styles.css">
    <title>Campanha | Lea Rifas</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./campaign-page.js" defer></script>
</head>
<body data-page="campaign">
<header class="site-header">
    <a class="brand" href="./index.html" aria-label="Lea Rifas — página inicial"><img src="./logo-transparent.png" alt="Lea Rifas — A sorte é sua"></a>
    <div class="account"><span class="avatar" aria-hidden="true"><img src="./avatar.png" alt=""></span><span id="account-name" class="account-name">Visitante</span><a id="auth-link" class="button secondary small" data-action="account" href="./entrar.html">Entrar</a></div>
</header>
<main class="shell">
    <div id="app-notice" class="notice" role="status" aria-live="polite" hidden></div>
    <nav class="nav" aria-label="Navegação principal">
        <a href="./index.html">Campanhas</a>
        <a href="./minhas-dezenas.html">Minhas dezenas</a>
        <a id="manager-nav" class="hidden" href="./painel.html">Painel gerencial</a>
    </nav>
    <section class="panel campaign-detail">
        <div class="section-heading">
            <div><h1 id="campaign-title">Carregando campanha…</h1><p id="campaign-description" class="muted"></p></div>
            <a class="button secondary small" href="./index.html">← Campanhas</a>
        </div>
        <div id="campaign-result" class="notice success hidden"></div>
        <div id="campaign-numbers" class="number-grid" aria-label="Dezenas da campanha"></div>
        <div id="selection-bar" class="selection-bar">
            <p><span id="selection-summary">Nenhuma dezena selecionada</span><small id="selection-total"></small></p>
            <button id="reserve-button" type="button" class="button">Reservar e enviar comprovante</button>
        </div>
    </section>
</main>
<footer class="site-footer">Lea Rifas deseja boa sorte! 🍀</footer>
</body>
</html>
